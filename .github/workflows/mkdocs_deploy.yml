name: Deploy MkDocs documentation

on:
    push:
        branches:
            - main
        paths:
            - "docs/**"
            - "**/mkdocs*.yml"
            - "**/mkdocs*.yaml"
            - "scripts/ci/publish-docs.sh"
            - "tests/ci/test_publish_docs.py"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: docs-main-deploy
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        env:
            ENABLED_HTMLPROOFER: ${{ vars.ENABLED_HTMLPROOFER || 'False' }}
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4
            - name: Install uv
              uses: astral-sh/setup-uv@v6
              with:
                  version: "0.8.17"
            - name: Set up Python
              run: uv python install
            - name: Install dependencies
              run: uv sync --locked --all-extras --dev

            - name: Test docs publishing
              run: uv run tests/ci/test_publish_docs.py
            - name: Build docs
              run: uv run mkdocs build
            - name: Deploy to gh-pages
              run: bash scripts/ci/publish-docs.sh site
