name: Release

on:
    workflow_dispatch:
        inputs:
            kind:
                description: Version bump
                required: true
                type: choice
                options:
                    - patch
                    - minor
                    - major
                default: patch
    push:
        tags:
            - "v*"

permissions:
    contents: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    validate:
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.version.outputs.tag }}
            commit: ${{ steps.version.outputs.commit }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0
            - name: Prepare release tag
              id: version
              shell: bash
              env:
                  RELEASE_KIND: ${{ inputs.kind }}
              run: |
                  version=$(tr -d '[:space:]' < VERSION)
                  if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                      echo "Invalid release version: $version" >&2
                      exit 1
                  fi
                  tag="v$version"
                  commit=$(git rev-parse HEAD)

                  if [[ "$GITHUB_EVENT_NAME" == push ]]; then
                      if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
                          echo "Tag $GITHUB_REF_NAME does not match VERSION ($tag)" >&2
                          exit 1
                      fi
                  else
                      if [[ "$GITHUB_REF_TYPE" != branch ]]; then
                          echo "Select a branch when starting a release" >&2
                          exit 1
                      fi
                      IFS=. read -r major minor patch <<< "$version"
                      case "$RELEASE_KIND" in
                          patch) patch=$((patch + 1)) ;;
                          minor) minor=$((minor + 1)); patch=0 ;;
                          major) major=$((major + 1)); minor=0; patch=0 ;;
                          *) echo "Invalid version bump: $RELEASE_KIND" >&2; exit 1 ;;
                      esac
                      version="$major.$minor.$patch"
                      tag="v$version"
                      echo "$version" > VERSION
                      git add VERSION

                      if git show-ref --verify --quiet "refs/tags/$tag"; then
                          tagged_commit=$(git rev-parse "refs/tags/$tag^{commit}")
                          # A full workflow retry must reuse exactly the same version update.
                          if [[ "$(git rev-list --parents -n 1 "$tagged_commit")" != "$tagged_commit $commit" ||
                                "$(git rev-parse "$tagged_commit^{tree}")" != "$(git write-tree)" ]]; then
                              echo "Tag $tag already exists for a different release" >&2
                              exit 1
                          fi
                          commit=$tagged_commit
                      else
                          git -c 'user.name=github-actions[bot]' \
                              -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' \
                              commit -m "Update VERSION to $version"
                          commit=$(git rev-parse HEAD)
                          git tag "$tag" "$commit"
                          git push --atomic origin "HEAD:refs/heads/$GITHUB_REF_NAME" "refs/tags/$tag"
                      fi
                  fi

                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "commit=$commit" >> "$GITHUB_OUTPUT"

    build:
        needs: validate
        uses: ./.github/workflows/build.yml
        with:
            upload_artifacts: true
            ref: ${{ needs.validate.outputs.commit }}

    release:
        needs: [validate, build]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  pattern: slang-format-*
                  path: release-artifacts
                  merge-multiple: true

            - name: Publish GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_TAG: ${{ needs.validate.outputs.tag }}
              run: gh release create "$RELEASE_TAG" release-artifacts/* --generate-notes --verify-tag
