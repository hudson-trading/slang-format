name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Match tag to VERSION
              shell: bash
              run: test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}"

    build:
        needs: validate
        uses: ./.github/workflows/build.yml
        with:
            upload_artifacts: true
            ref: ${{ github.ref }}

    release:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  pattern: slang-format-*
                  path: release-artifacts
                  merge-multiple: true

            - name: Publish GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "${GITHUB_REF_NAME}" release-artifacts/* --generate-notes --verify-tag
