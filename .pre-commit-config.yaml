# To use:
#
#     prek run --all-files
#
# Or:
#
#     prek install  # (runs every time you commit in git)
#
# To update this file:
#
#     prek autoupdate
#
# See https://prek.j178.dev/

ci:
    autoupdate_commit_msg: "chore: update pre-commit hooks"
    autofix_commit_msg: "style: pre-commit fixes"

repos:
    # Standard hooks
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-case-conflict
          - id: check-merge-conflict
          - id: check-yaml
            args: [--allow-multiple-documents]
          - id: debug-statements
          - id: end-of-file-fixer
          - id: fix-byte-order-marker
          - id: mixed-line-ending
            args: [--fix, lf]
          - id: trailing-whitespace

    - repo: https://github.com/DavidAnson/markdownlint-cli2
      rev: v0.18.1
      hooks:
          - id: markdownlint-cli2
            exclude: ^external/.*

    # CMake formatting
    - repo: https://github.com/cheshirekow/cmake-format-precommit
      rev: v0.6.13
      hooks:
          - id: cmake-format
            additional_dependencies: [pyyaml]
            types: [file]
            files: (\.cmake|CMakeLists.txt)(.in)?$
            exclude: ^external/.*

    # clang-format for C and C++
    - repo: https://github.com/pre-commit/mirrors-clang-format
      rev: v20.1.8
      hooks:
          - id: clang-format
            types_or: [c++, c]
            exclude: ^external/.*

    # Prettier for TypeScript, JSON, and YAML
    - repo: https://github.com/pre-commit/mirrors-prettier
      rev: v4.0.0-alpha.8
      hooks:
          - id: prettier
            # A batch can contain only tracked fixtures excluded by .gitignore.
            args: [--no-error-on-unmatched-pattern]
            files: ^.*\.(ts|js|json|yml|yaml)$
            exclude: ^external/.*

    - repo: https://github.com/astral-sh/ruff-pre-commit
      # Ruff version.
      rev: v0.13.0
      hooks:
          # Run the linter.
          - id: ruff-check
            files: ^.*\.py$
            args: [--fix]
            exclude: ^external/.*
          # Run the formatter.
          - id: ruff-format
            files: ^.*\.py$
            exclude: ^external/.*

    # Local hook for formatter config documentation and schema synchronization
    - repo: local
      hooks:
          - id: format-style-sync
            name: Check formatter list-style generation
            entry: python3 scripts/gen_format_style.py --check
            language: system
            pass_filenames: false
            files: ^(external/slang|scripts/gen_format_style\.py|src/FormatStyleGen\.inc)$
          - id: format-config-schema-sync
            name: Regenerate formatter config schema and docs
            entry: python3 scripts/genconfig.py
            language: system
            pass_filenames: false
            files: ^include/format/FormatConfig\.h$
